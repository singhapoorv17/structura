[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-engine"
version = "0.1.0"
description = "Open-source energy project-finance structuring engine: debt sizing, DSCR sculpting, coverage ratios and cash waterfall."
readme = "engine/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "project-finance",
    "dscr",
    "debt-sculpting",
    "llcr",
    "plcr",
    "renewable-energy",
    "infrastructure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

# Runtime dependencies. openpyxl is a runtime dep as of Phase 4: the Excel
# export (export/) is a headline feature, not an optional extra — it is the
# artifact SAM provably cannot produce for these structures.
dependencies = [
    "scipy>=1.11",
    "numpy>=1.26",
    "pyxirr>=0.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["engine", "engine.tax", "engine.structures", "export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error"]
